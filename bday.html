<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Birthday!✨</title>

  <!-- Tailwind CSS for responsive layout utilities -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Festive handwriting + clean rounded body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Pacifico&family=Quicksand:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* =====================================================================
       BASE & DREAMY ANIMATED PASTEL ATMOSPHERE
       ===================================================================== */
    :root {
      --font-display: 'Pacifico', 'Dancing Script', cursive;
      --font-hand: 'Dancing Script', cursive;
      --font-body: 'Quicksand', 'Segoe UI', system-ui, sans-serif;
      --ink-primary: #4a1e38;
      --ink-secondary: #7c3b5e;
      --rose-accent: #ff5c8a;
      --peach-accent: #ff9a76;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: var(--font-body);
      color: var(--ink-primary);
      user-select: none;
    }

    /* Smoothly shifting dreamy pastel gradient backdrop */
    body {
      background: linear-gradient(
        -45deg,
        #ffd1dc,
        #ffe1c6,
        #e5d4ff,
        #ffc4d6,
        #ffd8e4
      );
      background-size: 400% 400%;
      animation: gradientShift 16s ease-in-out infinite;
      position: relative;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .font-display {
      font-family: var(--font-display);
    }

    .font-hand {
      font-family: var(--font-hand);
    }

    /* =====================================================================
       BACKGROUND AMBIENT LAYER: BALLOONS, TWINKLING STARS & BOKEH HEARTS
       ===================================================================== */
    #ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .twinkle-star {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 20%, rgba(255, 255, 255, 0) 75%);
      animation: twinkle var(--dur, 3s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
      opacity: 0.2;
    }

    @keyframes twinkle {
      0%, 100% { transform: scale(0.7); opacity: 0.2; }
      50% { transform: scale(1.35); opacity: 0.95; }
    }

    .bokeh-heart {
      position: absolute;
      bottom: -60px;
      opacity: 0;
      filter: blur(1px);
      animation: floatUpHeart var(--dur, 12s) linear infinite;
      animation-delay: var(--delay, 0s);
    }

    @keyframes floatUpHeart {
      0% {
        transform: translateY(0) translateX(0) scale(0.7) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: var(--max-opacity, 0.35);
      }
      85% {
        opacity: var(--max-opacity, 0.3);
      }
      100% {
        transform: translateY(-115dvh) translateX(var(--drift, 35px)) scale(1.15) rotate(22deg);
        opacity: 0;
      }
    }

    .ambient-balloon {
      position: absolute;
      bottom: -140px;
      opacity: 0;
      animation: floatBalloon var(--dur, 20s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    @keyframes floatBalloon {
      0% {
        transform: translateY(0) translateX(0) rotate(-4deg);
        opacity: 0;
      }
      12% {
        opacity: 0.52;
      }
      50% {
        transform: translateY(-60dvh) translateX(var(--sway, 30px)) rotate(4deg);
        opacity: 0.52;
      }
      88% {
        opacity: 0.45;
      }
      100% {
        transform: translateY(-125dvh) translateX(calc(var(--sway, 30px) * -0.7)) rotate(-3deg);
        opacity: 0;
      }
    }

    /* Full-screen HTML5 Canvas overlay for confetti, fireworks, hearts & sparkles */
    #fx-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 40;
    }

    /* =====================================================================
       TOP-RIGHT AUDIO TOGGLE & BOTTOM PROGRESS DOTS
       ===================================================================== */
    #audio-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 50;
      width: 44px;
      height: 44px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 6px 20px rgba(173, 73, 120, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-primary);
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    #audio-toggle:hover {
      transform: scale(1.08);
      background: rgba(255, 255, 255, 0.88);
    }

    #audio-toggle:active {
      transform: scale(0.95);
    }

    #progress-dots {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 14px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 4px 14px rgba(160, 68, 114, 0.1);
    }

    .progress-dot {
      width: 9px;
      height: 9px;
      border-radius: 9999px;
      background: rgba(124, 59, 94, 0.28);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .progress-dot.active {
      width: 26px;
      background: linear-gradient(90deg, #ff5c8a, #ff9a76);
      box-shadow: 0 0 10px rgba(255, 92, 138, 0.55);
    }

    /* =====================================================================
       SCREEN STAGE & TRANSITIONS (SCALE + FADE + SLIDE)
       ===================================================================== */
    #stage {
      position: relative;
      width: 100%;
      height: 100dvh;
      z-index: 10;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px 18px 58px;
      opacity: 0;
      transform: translateY(28px) scale(0.94);
      pointer-events: none;
      visibility: hidden;
      transition:
        opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.65s cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0.65s;
    }

    .screen.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
      visibility: visible;
    }

    .screen.exiting {
      opacity: 0;
      transform: translateY(-24px) scale(1.04);
      pointer-events: none;
      visibility: hidden;
    }

    /* Common gentle floating header & pulsing prompts */
    .float-heading {
      animation: floatGentle 3.6s ease-in-out infinite;
      text-shadow: 0 3px 16px rgba(255, 255, 255, 0.8);
    }

    @keyframes floatGentle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .bounce-in-heading {
      opacity: 0;
      transform: scale(0.75) translateY(-14px);
    }

    .screen.active .bounce-in-heading {
      animation: bounceEntrance 0.85s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s forwards;
    }

    @keyframes bounceEntrance {
      0% { opacity: 0; transform: scale(0.75) translateY(-14px); }
      65% { opacity: 1; transform: scale(1.06) translateY(2px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .pulse-prompt {
      animation: softPulse 2.2s ease-in-out infinite;
    }

    @keyframes softPulse {
      0%, 100% { opacity: 0.72; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    /* =====================================================================
       SCREEN 1: CUSTOM 3D INTERACTIVE ENVELOPE
       ===================================================================== */
    .envelope-scene {
      perspective: 1100px;
      cursor: pointer;
      padding: 20px;
      margin: 8px 0;
    }

    .envelope-bob {
      animation: envelopeBob 3.2s ease-in-out infinite;
      transition: transform 0.3s ease;
    }

    .envelope-scene:hover .envelope-bob {
      transform: scale(1.04);
    }

    .envelope-scene.opened .envelope-bob {
      animation: none;
    }

    @keyframes envelopeBob {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }

    .envelope-wrapper {
      position: relative;
      width: 268px;
      height: 178px;
      transform-style: preserve-3d;
      filter: drop-shadow(0 18px 32px rgba(189, 77, 125, 0.28));
    }

    @media (min-width: 640px) {
      .envelope-wrapper {
        width: 300px;
        height: 198px;
      }
    }

    /* Warm soft halo glow behind envelope */
    .envelope-glow {
      position: absolute;
      inset: -16px;
      border-radius: 28px;
      background: radial-gradient(circle, rgba(255, 130, 170, 0.45) 0%, rgba(255, 200, 170, 0) 72%);
      animation: glowPulse 2.6s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.65; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1.06); }
    }

    /* Envelope back interior */
    .env-back {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      background: linear-gradient(165deg, #f7d5de 0%, #f3becd 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.75);
      z-index: 1;
    }

    /* Sliding Golden Birthday Invite Card tucked inside */
    .env-card {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 12px;
      height: 146px;
      border-radius: 12px;
      background: linear-gradient(135deg, #fffdf5 0%, #fff2cc 48%, #ffe5a3 100%);
      border: 2px solid #f5cb6c;
      box-shadow: 0 6px 18px rgba(173, 120, 34, 0.22);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      transform: translateY(0);
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.26s;
      overflow: hidden;
    }

    .env-card::after {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px dashed rgba(217, 155, 38, 0.55);
      border-radius: 8px;
      pointer-events: none;
    }

    .envelope-scene.opened .env-card {
      transform: translateY(-96px) scale(1.02);
    }

    /* Front side & bottom folded flaps via crisp CSS clip-paths */
    .env-front-pocket {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      overflow: hidden;
      z-index: 3;
      pointer-events: none;
    }

    .env-flap-left {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #fff5f7 0%, #ffe3ea 100%);
      clip-path: polygon(0 0, 52% 54%, 0 100%);
    }

    .env-flap-right {
      position: absolute;
      inset: 0;
      background: linear-gradient(225deg, #fff2f5 0%, #ffdbe4 100%);
      clip-path: polygon(100% 0, 48% 54%, 100% 100%);
    }

    .env-flap-bottom {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, #ffeef2 0%, #fff9fa 100%);
      clip-path: polygon(0 100%, 50% 48%, 100% 100%);
      filter: drop-shadow(0 -2px 4px rgba(180, 90, 120, 0.12));
    }

    /* Top triangular 3D flap */
    .env-flap-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 58%;
      transform-origin: top center;
      transform: rotateX(0deg);
      z-index: 5;
      transition: transform 0.62s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s linear 0.24s;
      filter: drop-shadow(0 5px 8px rgba(173, 73, 114, 0.18));
    }

    .env-flap-top-shape {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #fff8fa 0%, #ffe6ed 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
    }

    .envelope-scene.opened .env-flap-top {
      transform: rotateX(180deg);
      z-index: 1;
    }

    /* Glowing Pulsing Red Heart Wax Seal */
    .wax-seal {
      position: absolute;
      top: 52%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #ff6b8b 0%, #e62e5c 58%, #b31942 100%);
      box-shadow:
        0 4px 12px rgba(179, 25, 66, 0.45),
        0 0 22px rgba(255, 77, 121, 0.55),
        inset 0 2px 4px rgba(255, 180, 200, 0.55);
      border: 2.5px solid rgba(255, 195, 210, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 7;
      animation: sealPulse 1.8s ease-in-out infinite;
      transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.28s ease;
    }

    @keyframes sealPulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
        box-shadow: 0 4px 12px rgba(179, 25, 66, 0.45), 0 0 18px rgba(255, 77, 121, 0.5);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.1);
        box-shadow: 0 6px 18px rgba(179, 25, 66, 0.55), 0 0 30px rgba(255, 77, 121, 0.85);
      }
    }

    .envelope-scene.opened .wax-seal {
      animation: none;
      transform: translate(-50%, -50%) scale(1.65) rotate(16deg);
      opacity: 0;
      pointer-events: none;
    }

    /* =====================================================================
       SCREEN 2: INTERACTIVE ANIMATED BIRTHDAY CAKE
       ===================================================================== */
    .cake-stage {
      position: relative;
      width: 270px;
      height: 270px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin: 6px 0;
      transition: transform 0.25s ease;
    }

    @media (min-width: 640px) {
      .cake-stage {
        width: 300px;
        height: 295px;
      }
    }

    .cake-stage:hover {
      transform: scale(1.03);
    }

    .cake-stage:active {
      transform: scale(0.98);
    }

    /* Warm radial glow behind flames */
    .candle-ambient-glow {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 190px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 224, 130, 0.68) 0%, rgba(255, 180, 120, 0.25) 45%, rgba(255, 200, 150, 0) 75%);
      pointer-events: none;
      animation: glowFlicker 1.9s ease-in-out infinite;
      transition: opacity 0.5s ease;
    }

    .cake-stage.candles-out .candle-ambient-glow {
      opacity: 0;
    }

    @keyframes glowFlicker {
      0%, 100% { opacity: 0.85; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.08); }
    }

    /* Flickering CSS flames overlaid accurately on the 3 SVG candles */
    .flames-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .flame-holder {
      position: absolute;
      width: 22px;
      height: 36px;
      transform: translate(-50%, -100%);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .flame-holder.c1 { left: 38.5%; top: 31%; }
    .flame-holder.c2 { left: 50%;   top: 27.5%; }
    .flame-holder.c3 { left: 61.5%; top: 31%; }

    .flame {
      width: 15px;
      height: 26px;
      border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
      background: radial-gradient(ellipse at 50% 72%, #fffef2 0%, #ffe066 42%, #ff922b 82%, #ff5c33 100%);
      box-shadow: 0 0 14px 4px rgba(255, 183, 77, 0.78), 0 0 28px 6px rgba(255, 138, 101, 0.42);
      transform-origin: bottom center;
      animation: flameFlicker 0.24s ease-in-out infinite alternate;
      transition: transform 0.35s ease, opacity 0.35s ease;
    }

    .flame-holder.c2 .flame {
      animation-delay: -0.09s;
      width: 16px;
      height: 28px;
    }

    .flame-holder.c3 .flame {
      animation-delay: -0.17s;
    }

    @keyframes flameFlicker {
      0% { transform: scale(0.95, 1.04) skewX(-3deg); }
      50% { transform: scale(1.04, 0.96) skewX(2.5deg); }
      100% { transform: scale(0.98, 1.06) skewX(-1.5deg); }
    }

    .cake-stage.candles-out .flame {
      animation: none;
      transform: scale(0.1, 0.1) translateY(8px);
      opacity: 0;
    }

    /* Animated rising smoke puffs when candles are blown out */
    .smoke-puff {
      position: absolute;
      bottom: 4px;
      left: 50%;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.85) 0%, rgba(220, 210, 225, 0.45) 55%, rgba(255, 255, 255, 0) 100%);
      opacity: 0;
      transform: translate(-50%, 0) scale(0.4);
      pointer-events: none;
    }

    .cake-stage.candles-out .smoke-puff.p1 {
      animation: riseSmokeLeft 1.4s ease-out 0.05s forwards;
    }

    .cake-stage.candles-out .smoke-puff.p2 {
      animation: riseSmokeRight 1.65s ease-out 0.22s forwards;
    }

    @keyframes riseSmokeLeft {
      0% { opacity: 0; transform: translate(-50%, 0) scale(0.4); }
      20% { opacity: 0.85; }
      100% { opacity: 0; transform: translate(-115%, -68px) scale(2.3); }
    }

    @keyframes riseSmokeRight {
      0% { opacity: 0; transform: translate(-50%, -4px) scale(0.35); }
      25% { opacity: 0.72; }
      100% { opacity: 0; transform: translate(35%, -82px) scale(2.6); }
    }

    /* Animated cake slice pop-out + sparkle cut sweep */
    #cake-slice-group {
      transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: center;
    }

    .cake-stage.cake-cut #cake-slice-group {
      transform: translate(16px, 7px) rotate(5deg);
    }

    .cut-sparkle-sweep {
      position: absolute;
      top: 40%;
      left: 20%;
      width: 65%;
      height: 6px;
      border-radius: 9999px;
      background: linear-gradient(90deg, rgba(255,255,255,0), #fff9db, #ffd43b, #ff85a1, rgba(255,255,255,0));
      box-shadow: 0 0 18px #ffd43b, 0 0 28px #ffffff;
      opacity: 0;
      transform: rotate(-32deg) scaleX(0.1);
      pointer-events: none;
      z-index: 8;
    }

    .cake-stage.cake-cut .cut-sparkle-sweep {
      animation: cutSweep 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes cutSweep {
      0% { opacity: 0; transform: translate(-35px, -25px) rotate(-32deg) scaleX(0.2); }
      30% { opacity: 1; transform: translate(0, 0) rotate(-32deg) scaleX(1.1); }
      100% { opacity: 0; transform: translate(42px, 28px) rotate(-32deg) scaleX(0.35); }
    }

    /* =====================================================================
       SCREEN 3: INTERACTIVE MULTI-PHOTO POLAROID DECK / STACK
       ===================================================================== */
    #screen3 {
      padding: 16px 16px 56px;
      gap: 4px;
    }

    .polaroid-deck-stage {
      perspective: 1100px;
      position: relative;
      width: min(305px, 84vw);
      height: min(395px, 49dvh);
      min-height: 320px;
      margin: 10px 0 12px;
      touch-action: none; /* Enables crisp touch drag/swipe without scrolling */
    }

    /* Gentle pendulum entrance when Screen 3 becomes active */
    .deck-entrance-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      transform-origin: top center;
    }

    .screen.active .deck-entrance-wrap {
      animation: deckPendulum 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes deckPendulum {
      0% { transform: rotate(8deg) translateY(-18px) scale(0.95); opacity: 0; }
      35% { transform: rotate(-4deg) translateY(0) scale(1); opacity: 1; }
      68% { transform: rotate(2deg); }
      100% { transform: rotate(0deg); }
    }

    /* Individual Polaroid card inside the 3D stack (strict vertical flex, never clips caption) */
    .polaroid-card {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #fffdfb;
      padding: 12px 12px 14px 12px;
      border-radius: 10px;
      overflow: visible;
      box-shadow:
        0 18px 34px rgba(130, 52, 92, 0.2),
        0 4px 12px rgba(0, 0, 0, 0.08);
      transform-style: preserve-3d;
      transform-origin: center center;
      transition:
        transform 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.42s ease,
        box-shadow 0.3s ease,
        filter 0.4s ease;
      display: flex;
      flex-direction: column;
      will-change: transform, opacity;
      pointer-events: none;
    }

    .polaroid-card.is-top {
      pointer-events: auto;
      cursor: grab;
      box-shadow:
        0 22px 42px rgba(130, 52, 92, 0.26),
        0 6px 14px rgba(0, 0, 0, 0.09);
    }

    .polaroid-card.is-top:active,
    .polaroid-card.is-dragging {
      cursor: grabbing;
    }

    .polaroid-card.is-dragging {
      transition: box-shadow 0.2s ease !important;
      box-shadow:
        0 28px 54px rgba(130, 52, 92, 0.32),
        0 10px 20px rgba(0, 0, 0, 0.12);
    }

    .polaroid-card.no-transition {
      transition: none !important;
    }

    /* Fly-off toss animations when flipping to next or previous card */
    .polaroid-card.tossing-left {
      transition: transform 0.36s cubic-bezier(0.32, 0, 0.67, 0.2), opacity 0.32s ease !important;
      transform: translate3d(-340px, -22px, 0) rotate(-22deg) scale(0.92) !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* =========================================================================
       3. WEB AUDIO API SYNTHESIZER (MUSIC-BOX MELODY + CELEBRATORY CHIMES)
       Zero external audio URLs; starts softly after the first user tap.
       ========================================================================= */
    const SoundEngine = (() => {
      let ctx = null;
      let isMuted = false;
      let melodyStarted = false;
      let melodyTimer = null;
      let melodyToken = 0;

      // Gentle "Happy Birthday" notes: [frequency Hz, beats]
      const HAPPY_BIRTHDAY_NOTES = [
        [261.63, 0.75], [261.63, 0.25], [293.66, 1.0], [261.63, 1.0], [349.23, 1.0], [329.63, 2.0],
        [261.63, 0.75], [261.63, 0.25], [293.66, 1.0], [261.63, 1.0], [392.00, 1.0], [349.23, 2.0],
        [261.63, 0.75], [261.63, 0.25], [523.25, 1.0], [440.00, 1.0], [349.23, 1.0], [329.63, 1.0], [293.66, 1.8],
        [466.16, 0.75], [466.16, 0.25], [440.00, 1.0], [349.23, 1.0], [392.00, 1.0], [349.23, 2.4]
      ];

      function ensureContext() {
        try {
          if (!ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return null;
            ctx = new AudioCtx();
          }
          if (ctx.state === 'suspended') {
            ctx.resume();
          }
          return ctx;
        } catch (err) {
          return null;
        }
      }

      // Soft music-box bell tone
      function playBellNote(freq, duration = 0.7, volume = 0.055, delaySec = 0) {
        if (isMuted) return;
        const audio = ensureContext();
        if (!audio) return;

        try {
          const now = audio.currentTime + delaySec;
          const osc = audio.createOscillator();
          const harmonic = audio.createOscillator();
          const gain = audio.createGain();
          const harmonicGain = audio.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);

          harmonic.type = 'triangle';
          harmonic.frequency.setValueAtTime(freq * 2, now);

          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(volume, now + 0.018);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

          harmonicGain.gain.setValueAtTime(0.0001, now);
          harmonicGain.gain.exponentialRampToValueAtTime(volume * 0.24, now + 0.015);
          harmonicGain.gain.exponentialRampToValueAtTime(0.0001, now + duration * 0.65);

          osc.connect(gain);
          harmonic.connect(harmonicGain);
          gain.connect(audio.destination);
          harmonicGain.connect(audio.destination);

          osc.start(now);
          harmonic.start(now);
          osc.stop(now + duration + 0.05);
          harmonic.stop(now + duration + 0.05);
        } catch (err) {
          // Safely ignore audio scheduling errors
        }
      }

      // Soft airy paper whoosh + delicate chime when flipping Polaroid photos
      function playCardFlip() {
        if (isMuted) return;
        const audio = ensureContext();
        if (!audio) return;

        try {
          // Short filtered white-noise breeze for a tactile card whoosh
          const sampleRate = audio.sampleRate;
          const length = Math.floor(sampleRate * 0.13);
          const buffer = audio.createBuffer(1, length, sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < length; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.sin((i / length) * Math.PI);
          }

          const noise = audio.createBufferSource();
          noise.buffer = buffer;

          const filter = audio.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1100, audio.currentTime);
          filter.frequency.exponentialRampToValueAtTime(2400, audio.currentTime + 0.12);
          filter.Q.value = 1.4;

          const gain = audio.createGain();
          gain.gain.setValueAtTime(0.001, audio.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.06, audio.currentTime + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.13);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(audio.destination);
          noise.start(audio.currentTime);

          // Tiny sweet sparkle interval
          playBellNote(880, 0.32, 0.042, 0.01);
          playBellNote(1174.66, 0.42, 0.038, 0.055);
        } catch (err) {
          // Safely ignore audio errors
        }
      }

      function scheduleMelodyStep(index, token) {
        if (token !== melodyToken || isMuted || !melodyStarted) return;

        if (index >= HAPPY_BIRTHDAY_NOTES.length) {
          // Calm pause before looping gently
          melodyTimer = setTimeout(() => scheduleMelodyStep(0, token), 3200);
          return;
        }

        const [freq, beats] = HAPPY_BIRTHDAY_NOTES[index];
        const beatMs = 460;
        playBellNote(freq * 2, Math.max(0.55, (beats * beatMs) / 900), 0.042);

        melodyTimer = setTimeout(() => {
          scheduleMelodyStep(index + 1, token);
        }, beats * beatMs);
      }

      function startMelodyIfReady() {
        ensureContext();
        if (melodyStarted || isMuted) return;
        melodyStarted = true;
        melodyToken++;
        scheduleMelodyStep(0, melodyToken);
      }

      function stopMelody() {
        melodyToken++;
        if (melodyTimer) {
          clearTimeout(melodyTimer);
          melodyTimer = null;
        }
      }

      function toggleMute() {
        isMuted = !isMuted;
        const onIcon = document.getElementById('icon-sound-on');
        const offIcon = document.getElementById('icon-sound-off');

        if (isMuted) {
          onIcon.classList.add('hidden');
          offIcon.classList.remove('hidden');
          stopMelody();
        } else {
          onIcon.classList.remove('hidden');
          offIcon.classList.add('hidden');
          ensureContext();
          if (melodyStarted) {
            melodyToken++;
            scheduleMelodyStep(0, melodyToken);
          } else {
            startMelodyIfReady();
          }
        }
        return isMuted;
      }

      // Celebratory chimes for interactions
      function playChime(type = 'sparkle') {
        if (isMuted) return;
        ensureContext();
        if (type === 'envelope') {
          [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => playBellNote(f, 0.75, 0.075, i * 0.07));
        } else if (type === 'wish') {
          [587.33, 739.99, 880.0, 1174.66, 1479.98].forEach((f, i) => playBellNote(f, 0.85, 0.068, i * 0.065));
        } else if (type === 'celebrate') {
          [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98].forEach((f, i) => playBellNote(f, 0.9, 0.078, i * 0.055));
        } else if (type === 'flip') {
          playCardFlip();
        } else {
          [783.99, 1046.5, 1318.5].forEach((f, i) => playBellNote(f, 0.55, 0.055, i * 0.05));
        }
      }

      return {
        startMelodyIfReady,
        toggleMute,
        playChime
      };
    })();

    document.getElementById('audio-toggle').addEventListener('click', () => {
      SoundEngine.toggleMute();
    });

    /* =========================================================================
       4. FULL-SCREEN HTML5 CANVAS PARTICLE ENGINE
       Handles confetti cannons, colorful fireworks bursts, floating hearts,
       golden wish sparkles, and mouse/touch sparkle trails.
       ========================================================================= */
    const ParticleFX = (() => {
      const canvas = document.getElementById('fx-canvas');
      const ctx = canvas.getContext('2d');
      let width = window.innerWidth;
      let height = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);
      let animStarted = false;

      const particles = [];
      const MAX_PARTICLES = 420;

      const COLORS = [
        '#ff5c8a', '#ff85a1', '#ffb3c6', '#ffd166',
        '#ff9a76', '#a78bfa', '#60d394', '#74c0fc', '#ffffff'
      ];

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener('resize', resize);
      resize();

      function pushParticle(p) {
        if (particles.length >= MAX_PARTICLES) {
          particles.shift();
        }
        particles.push(p);
      }

      // Draw a cute canvas heart centered at (0, 0)
      function drawHeart(c, size) {
        c.beginPath();
        const topCurve = size * 0.3;
        c.moveTo(0, topCurve);
        c.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurve);
        c.bezierCurveTo(-size / 2, (size + topCurve) / 2, 0, (size + topCurve) / 1.4, 0, size);
        c.bezierCurveTo(0, (size + topCurve) / 1.4, size / 2, (size + topCurve) / 2, size / 2, topCurve);
        c.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurve);
        c.closePath();
        c.fill();
      }

      // Draw a 4-point glowing star sparkle
      function drawSparkle(c, r) {
        c.beginPath();
        for (let i = 0; i < 8; i++) {
          const rad = i % 2 === 0 ? r : r * 0.32;
          const angle = (i * Math.PI) / 4;
          const x = Math.cos(angle) * rad;
          const y = Math.sin(angle) * rad;
          if (i === 0) c.moveTo(x, y);
          else c.lineTo(x, y);
        }
        c.closePath();
        c.fill();
      }

      // Confetti cannon burst from a given coordinate
      function burstConfetti(x = width / 2, y = height / 2, count = 65) {
        for (let i = 0; i < count; i++) {
          const angle = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
          const speed = 4 + Math.random() * 9.5;
          pushParticle({
            type: 'confetti',
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2,
            gravity: 0.16 + Math.random() * 0.08,
            drag: 0.985,
            size: 6 + Math.random() * 6,
            color: COLORS[Math.floor(Math.random() * COLORS.length)],
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.24,
            tilt: Math.random() * Math.PI,
            vTilt: 0.12 + Math.random() * 0.14,
            life: 1,
            decay: 0.008 + Math.random() * 0.007
          });
        }
      }

      // Colorful radial fireworks burst
      function burstFirework(x = width * (0.2 + Math.random() * 0.6), y = height * (0.18 + Math.random() * 0.35), count = 42) {
        const baseColor = COLORS[Math.floor(Math.random() * (COLORS.length - 1))];
        const altColor = COLORS[Math.floor(Math.random() * COLORS.length)];
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.18;
          const speed = 2.2 + Math.random() * 5.8;
          pushParticle({
            type: 'firework',
            x,
            y,
            px: x,
            py: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            gravity: 0.065,
            drag: 0.955,
            size: 2.2 + Math.random() * 2.4,
            color: i % 3 === 0 ? '#ffffff' : (i % 2 === 0 ? baseColor : altColor),
            life: 1,
            decay: 0.015 + Math.random() * 0.012
          });
        }
      }

      // Burst of floating hearts
      function burstHearts(x = width / 2, y = height / 2, count = 20) {
        const heartPalette = ['#ff4d6d', '#ff758f', '#ff8fab', '#ffb3c6', '#ffd166'];
        for (let i = 0; i < count; i++) {
          const angle = -Math.PI / 2 + (Math.random() - 0.5) * 2.2;
          const speed = 1.8 + Math.random() * 4.5;
          pushParticle({
            type: 'heart',
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1.2,
            gravity: -0.02, // Gently floats upward
            drag: 0.975,
            size: 10 + Math.random() * 11,
            color: heartPalette[Math.floor(Math.random() * heartPalette.length)],
            rot: (Math.random() - 0.5) * 0.5,
            vRot: (Math.random() - 0.5) * 0.04,
            life: 1,
            decay: 0.011 + Math.random() * 0.008
          });
        }
      }

      // Golden sparkles (used for wish blow-out and subtle cursor trail)
      function burstSparkles(x, y, count = 18, golden = true) {
        const palette = golden
          ? ['#fff9db', '#ffe066', '#ffd43b', '#ffec99', '#ffffff']
          : ['#ffffff', '#ffe3ec', '#ffd43b', '#e5dbff'];
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.8 + Math.random() * 3.6;
          pushParticle({
            type: 'sparkle',
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 0.5,
            gravity: 0.02,
            drag: 0.96,
            size: 3.5 + Math.random() * 5.5,
            color: palette[Math.floor(Math.random() * palette.length)],
            rot: Math.random() * Math.PI,
            vRot: (Math.random() - 0.5) * 0.14,
            life: 1,
            decay: 0.022 + Math.random() * 0.018
          });
        }
      }

      // Dual-side confetti cannons + fireworks grand burst
      function grandCelebration() {
        burstConfetti(width * 0.15, height * 0.72, 48);
        burstConfetti(width * 0.85, height * 0.72, 48);
        burstHearts(width * 0.5, height * 0.55, 22);
        burstFirework(width * 0.28, height * 0.26, 36);
        setTimeout(() => burstFirework(width * 0.72, height * 0.24, 38), 180);
        setTimeout(() => burstFirework(width * 0.5, height * 0.18, 42), 360);
      }

      // Subtle mouse & touch sparkle trail
      let lastTrailTime = 0;
      function emitTrail(x, y) {
        const now = performance.now();
        if (now - lastTrailTime < 28) return;
        lastTrailTime = now;
        burstSparkles(x, y, 2, false);
      }

      window.addEventListener('pointermove', (e) => {
        emitTrail(e.clientX, e.clientY);
      }, { passive: true });

      window.addEventListener('pointerdown', (e) => {
        burstSparkles(e.clientX, e.clientY, 7, false);
      }, { passive: true });

      // Main 60fps animation loop
      function animate() {
        ctx.clearRect(0, 0, width, height);

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.px = p.x;
          p.py = p.y;
          p.vx *= p.drag;
          p.vy = p.vy * p.drag + p.gravity;
          p.x += p.vx;
          p.y += p.vy;
          p.life -= p.decay;

          if (p.life <= 0 || p.y > height + 40) {
            particles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = Math.max(0, Math.min(1, p.life));

          if (p.type === 'confetti') {
            p.rot += p.vRot;
            p.tilt += p.vTilt;
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.scale(1, Math.cos(p.tilt));
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size * 0.32, p.size, p.size * 0.64);
          } else if (p.type === 'firework') {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = p.size;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(p.px, p.py);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2);
            ctx.fill();
          } else if (p.type === 'heart') {
            p.rot += p.vRot;
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            drawHeart(ctx, p.size);
          } else if (p.type === 'sparkle') {
            p.rot += p.vRot;
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            drawSparkle(ctx, p.size * p.life);
          }

          ctx.restore();
        }

        requestAnimationFrame(animate);
      }

      function startLoop() {
        if (animStarted) return;
        animStarted = true;
        animate();
      }

      window.addEventListener('load', startLoop);
      if (document.readyState === 'complete') {
        startLoop();
      }

      return {
        burstConfetti,
        burstFirework,
        burstHearts,
        burstSparkles,
        grandCelebration
      };
    })();

    /* =========================================================================
       5. INTERACTIVE MULTI-PHOTO POLAROID DECK CONTROLLER (SCREEN 3)
       Supports drag/swipe with live tilt, tap-to-flip, Prev/Next buttons,
       clickable dots, keyboard arrows, and 3D hover tilt on the top card.
       ========================================================================= */
    const PolaroidDeck = (() => {

      const counterEl = document.getElementById('deck-counter');
      const dotsEl = document.getElementById('deck-dots');
      const btnPrev = document.getElementById('btn-photo-prev');

      const total = Math.max(1, MEMORIES.length);
      const validTapes = new Set(['pink', 'lavender', 'peach', 'mint']);
      const cornerStickers = ['✨', '🌸', '⭐', '💫'];

      // Visual transforms for top card + up to 3 peeking cards behind it
      const STACK_POSES = [
        { x: 0,   y: 0,  rot: -1.2, scale: 1.0,  opacity: 1.0,  z: 24, bright: 1.0  },
        { x: -13, y: 6,  rot: -5.2, scale: 0.95, opacity: 0.97, z: 18, bright: 0.97 },
        { x: 14,  y: 10, rot: 4.5,  scale: 0.90, opacity: 0.92, z: 12, bright: 0.94 },
        { x: -6,  y: 14, rot: -2.4, scale: 0.85, opacity: 0.84, z: 6,  bright: 0.90 }
      ];

      let currentIndex = 0;
      let reachedLast = false;
      let isFlipping = false;
      let cards = [];
      let dotButtons = [];

      // Active pointer drag state
      let dragState = {
        active: false,
        pointerId: null,
        card: null,
        startX: 0,
        startY: 0,
        dx: 0,
        dy: 0,
        startTime: 0
      };

      // Build all Polaroid cards & dot indicators from the MEMORIES array
      function init() {
        deckEl.innerHTML = '';
        dotsEl.innerHTML = '';
        cards = [];
        dotButtons = [];

          // Photo frame with ambient blurred backdrop + uncropped foreground image
          const frame = document.createElement('div');
          frame.className = 'polaroid-photo-frame';

          const fallbackUri = createMemoryFallbackUri(item.src, idx);
          const photoFit = item.fit === 'cover' ? 'cover' : 'contain';
          const photoPos = item.position || 'center';

          // Soft ambient blurred background layer (fills edges seamlessly for portrait/landscape)
          const bgBlurImg = document.createElement('img');
          bgBlurImg.className = 'photo-bg-blur';
          bgBlurImg.alt = '';
          bgBlurImg.setAttribute('aria-hidden', 'true');
          bgBlurImg.draggable = false;

            bgBlurImg.style.display = 'none';

          // Crisp foreground image layer
          const img = document.createElement('img');

          img.alt = item.caption || `Memory ${idx + 1}`;
          img.draggable = false;
          img.style.objectFit = photoFit;
          img.style.objectPosition = photoPos;

          // Update both foreground and blur layers cleanly if a local file isn't found
          const applyFallback = () => {
            img.onerror = null;
            bgBlurImg.onerror = null;
            img.src = fallbackUri;
            bgBlurImg.src = fallbackUri;
          };

          img.onerror = applyFallback;
          bgBlurImg.onerror = () => {
            bgBlurImg.onerror = null;

          dot.addEventListener('click', () => jumpTo(idx));
          dotsEl.appendChild(dot);

        renderStack(true);
      }

      // Compute transform string for a given stack depth
      function applyPose(card, depth) {
        if (depth < STACK_POSES.length) {
          const p = STACK_POSES[depth];
          card.style.zIndex = String(p.z);
          card.style.transform = `translate3d(${p.x}px, ${p.y}px, 0) rotate(${p.rot}deg) scale(${p.scale})`;
          card.style.opacity = String(p.opacity);
          card.style.filter = `brightness(${p.bright})`;
        } else {
          card.style.zIndex = '2';
          card.style.transform = 'translate3d(0px, 16px, 0) rotate(0deg) scale(0.82)';
          card.style.opacity = '0';
          card.style.filter = 'brightness(0.88)';
        }
        card.classList.toggle('is-top', depth === 0);
      }

      // Update stack poses, counter text, dot states, and last-photo highlight
      function renderStack(skipHighlightEffect = false) {
        cards.forEach((card, idx) => {
          if (card.classList.contains('tossing-left') || card.classList.contains('tossing-right')) {
            return;
          }
          const depth = (idx - currentIndex + total) % total;
          applyPose(card, depth);
        });

        counterEl.textContent = `${currentIndex + 1} / ${total}`;
        dotButtons.forEach((dot, idx) => {
          dot.classList.toggle('active', idx === currentIndex);
          dot.setAttribute('aria-selected', idx === currentIndex ? 'true' : 'false');
        });

        // Once the user reaches the last photo, pulse/highlight "Keep Going →" with a celebratory sparkle
        if (!skipHighlightEffect && currentIndex === total - 1 && !reachedLast) {
          reachedLast = true;
          btnToLetter.classList.add('ready-pulse');
          const btnRect = btnToLetter.getBoundingClientRect();
          if (btnRect.width > 0) {
            ParticleFX.burstSparkles(
              btnRect.left + btnRect.width / 2,
              btnRect.top + btnRect.height / 2,
              20,
              true
            );
          }
        }
      }

      // Emit a mini burst of hearts & sparkles from the center of the deck
      function emitDeckBurst(clientX, clientY) {
        const rect = deckEl.getBoundingClientRect();
        const cx = clientX || rect.left + rect.width / 2;
        const cy = clientY || rect.top + rect.height * 0.45;
        ParticleFX.burstHearts(cx, cy, 8);
        ParticleFX.burstSparkles(cx, cy, 10, false);
      }

      // Flip forward (or backward via swipe right) by tossing the top card smoothly off the deck
      function flipWithToss(direction = 'left', step = 1, burstX = null, burstY = null) {
        if (total <= 1) {
          SoundEngine.playChime('sparkle');
          emitDeckBurst(burstX, burstY);
          return;
        }
        if (isFlipping) return;
        isFlipping = true;

        const outgoingCard = cards[currentIndex];
        const tossClass = direction === 'right' ? 'tossing-right' : 'tossing-left';

        SoundEngine.playChime('flip');
        emitDeckBurst(burstX, burstY);

        outgoingCard.classList.remove('is-top', 'is-dragging');
        outgoingCard.style.zIndex = '32';
        outgoingCard.classList.add(tossClass);

        // Immediately advance the stack beneath so the next card smoothly rises into focus
        currentIndex = (currentIndex + step + total) % total;
        renderStack(false);

        // After the tossed card flies out, tuck it cleanly to the back of the deck
        setTimeout(() => {
          outgoingCard.classList.add('no-transition');
          outgoingCard.classList.remove(tossClass);
          const backDepth = (Number(outgoingCard.dataset.index) - currentIndex + total) % total;
          applyPose(outgoingCard, backDepth);
          // Force style reflow before restoring transitions
          void outgoingCard.offsetWidth;
          outgoingCard.classList.remove('no-transition');
          isFlipping = false;
        }, 350);
      }

      // Bring the previous card swooping smoothly onto the top from the left (for Prev button / Left Arrow)
      function prevCard() {
        if (total <= 1 || isFlipping) return;
        isFlipping = true;

        const incomingIdx = (currentIndex - 1 + total) % total;
        const incomingCard = cards[incomingIdx];

        SoundEngine.playChime('flip');
        emitDeckBurst();

        // Position incoming card off-left invisibly before gliding it onto the top
        incomingCard.classList.add('no-transition');
        incomingCard.style.zIndex = '32';
        incomingCard.style.transform = 'translate3d(-250px, -18px, 0) rotate(-18deg) scale(0.95)';
        incomingCard.style.opacity = '0';
        void incomingCard.offsetWidth;
        incomingCard.classList.remove('no-transition');

        currentIndex = incomingIdx;
        requestAnimationFrame(() => {
          renderStack(false);
        });

        setTimeout(() => {
          isFlipping = false;
        }, 360);
      }

      function nextCard() {
        flipWithToss('left', 1);
      }

      function jumpTo(targetIdx) {
        if (targetIdx === currentIndex || isFlipping) return;
        const forwardDist = (targetIdx - currentIndex + total) % total;
        if (forwardDist === 1) {
          nextCard();
        } else if (forwardDist === total - 1) {
          prevCard();
        } else {
          SoundEngine.playChime('flip');
          emitDeckBurst();
          currentIndex = targetIdx;
          renderStack(false);
        }
      }

      // Attach pointer drag/swipe, tap-to-flip, and smooth 3D hover tilt
      function attachCardInteractions(card, idx) {
        card.addEventListener('pointerdown', (e) => {
          if (idx !== currentIndex || isFlipping) return;
          dragState = {
            active: true,
            pointerId: e.pointerId,
            card,
            startX: e.clientX,
            startY: e.clientY,
            dx: 0,
            dy: 0,
            startTime: performance.now()
          };
          card.classList.add('is-dragging');
          try {
            card.setPointerCapture(e.pointerId);
          } catch (err) {
            // Safe fallback if pointer capture isn't supported
          }
        });

        card.addEventListener('pointermove', (e) => {
          // Handle live drag/swipe when pointer is down
          if (dragState.active && dragState.card === card) {
            dragState.dx = e.clientX - dragState.startX;
            dragState.dy = (e.clientY - dragState.startY) * 0.35;
            const dragRot = -1.2 + dragState.dx * 0.085;
            card.style.transform = `translate3d(${dragState.dx}px, ${dragState.dy}px, 0) rotate(${dragRot}deg) scale(1.02)`;
            return;
          }

          // Smooth 3D hover tilt on desktop when not dragging
          if (idx === currentIndex && !isFlipping && e.pointerType === 'mouse') {
            const rect = card.getBoundingClientRect();
            const xNorm = (e.clientX - rect.left) / rect.width - 0.5;
            const yNorm = (e.clientY - rect.top) / rect.height - 0.5;
            const rotY = xNorm * 14;
            const rotX = -yNorm * 12;
            card.style.transform = `translate3d(0, -3px, 0) rotate(-1.2deg) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.025)`;
          }
        });

        function finishDrag(e, cancelled = false) {
          if (!dragState.active || dragState.card !== card) return;
          const { dx, dy, startTime, pointerId } = dragState;
          dragState.active = false;
          dragState.card = null;
          card.classList.remove('is-dragging');

          try {
            if (card.hasPointerCapture(pointerId)) {
              card.releasePointerCapture(pointerId);
            }
          } catch (err) {
            // Safe ignore
          }

          if (cancelled) {
            applyPose(card, 0);
            return;
          }

          const elapsed = Math.max(1, performance.now() - startTime);
          const velocity = Math.abs(dx) / elapsed;
          const totalMove = Math.hypot(dx, dy);

          // Tap / Click (minimal movement) -> smoothly fling to next photo
          if (totalMove <= 10) {
            flipWithToss('left', 1, e.clientX, e.clientY);
            return;
          }

          // Swipe left -> toss left to next photo
          if (dx < -62 || (dx < -28 && velocity > 0.38)) {
            flipWithToss('left', 1, e.clientX, e.clientY);
            return;
          }

          // Swipe right -> toss right to previous photo
          if (dx > 62 || (dx > 28 && velocity > 0.38)) {
            flipWithToss('right', -1, e.clientX, e.clientY);
            return;
          }

          // Below threshold -> elastic snap-back to center
          applyPose(card, 0);
        }

        card.addEventListener('pointerup', (e) => finishDrag(e, false));
        card.addEventListener('pointercancel', (e) => finishDrag(e, true));

        card.addEventListener('pointerleave', () => {
          if (!dragState.active && idx === currentIndex && !isFlipping) {
            applyPose(card, 0);
          }
        });
      }

      // Wire Prev/Next pill buttons
      btnPrev.addEventListener('click', prevCard);
      btnNext.addEventListener('click', nextCard);

      // Clean reset back to photo #1 for Replay Card
      function reset() {
        isFlipping = false;
        dragState.active = false;
        currentIndex = 0;
        reachedLast = false;
        btnToLetter.classList.remove('ready-pulse');
        cards.forEach((c) => {
          c.classList.remove('tossing-left', 'tossing-right', 'is-dragging', 'no-transition');
        });
        renderStack(true);
      }

      init();

      return {
        nextCard,
        prevCard,
        reset
      };
    })();

    /* =========================================================================
       6. SCREEN STATE CONTROLLER & INTERACTIVE LOGIC
       ========================================================================= */
    const App = (() => {
      let currentScreen = 1;
      let envelopeOpened = false;
      let cakeStep = 0; // 0 = lit, 1 = blown out, 2 = cut
      let activeTimers = [];
      let finaleFireworksInterval = null;

      const screens = [1, 2, 3, 4].map((n) => document.getElementById(`screen${n}`));
      const dots = Array.from(document.querySelectorAll('.progress-dot'));
      const envelopeScene = document.getElementById('envelope-scene');
      const envelopePrompt = document.getElementById('envelope-prompt');
      const waxSeal = document.getElementById('wax-seal');
      const cakeStage = document.getElementById('cake-stage');
      const cakeSubtitle = document.getElementById('cake-subtitle');
      const cakePrompt = document.getElementById('cake-prompt');
      const letterParas = Array.from(document.querySelectorAll('.letter-para'));
      const finaleIcons = document.getElementById('finale-icons');

      function scheduleTimer(fn, ms) {
        const id = setTimeout(() => {
          activeTimers = activeTimers.filter((t) => t !== id);
          fn();
        }, ms);
        activeTimers.push(id);
        return id;
      }

      function clearAllTimers() {
        activeTimers.forEach((id) => clearTimeout(id));
        activeTimers = [];
        if (finaleFireworksInterval) {
          clearInterval(finaleFireworksInterval);
          finaleFireworksInterval = null;
        }
      }

      // Smoothly transition between screens (scale + fade + slide)
      function goToScreen(num) {
        if (num === currentScreen) return;
        const prevEl = screens[currentScreen - 1];
        const nextEl = screens[num - 1];

        prevEl.classList.remove('active');
        prevEl.classList.add('exiting');

        scheduleTimer(() => {
          prevEl.classList.remove('exiting');
        }, 680);

        nextEl.classList.remove('exiting');
        requestAnimationFrame(() => {
          nextEl.classList.add('active');
        });

        currentScreen = num;

        // Update bottom 4-dot progress indicator
        dots.forEach((dot, idx) => {
          dot.classList.toggle('active', idx + 1 === num);
        });

        // Screen-specific entrance choreography
        if (num === 3) {
          ParticleFX.burstHearts(window.innerWidth / 2, window.innerHeight * 0.42, 16);
        } else if (num === 4) {
          startLetterFinale();
        }
      }

      /* --- SCREEN 1: 3D Envelope Interaction --- */
      function handleEnvelopeOpen() {
        if (envelopeOpened || currentScreen !== 1) return;
        envelopeOpened = true;

        // Unlock & gently start the music-box Happy Birthday melody on first tap
        SoundEngine.startMelodyIfReady();
        SoundEngine.playChime('envelope');

        // Pop seal & trigger burst of hearts right from the wax seal
        const rect = waxSeal.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        envelopeScene.classList.add('opened');
        envelopePrompt.textContent = 'Opening your surprise... ✨';

        ParticleFX.burstHearts(cx, cy, 24);
        scheduleTimer(() => {
          ParticleFX.burstConfetti(cx, cy - 20, 62);
        }, 240);

        // Transition smoothly to Screen 2 after ~1.15s
        scheduleTimer(() => {
          goToScreen(2);
        }, 1150);
      }

      envelopeScene.addEventListener('click', handleEnvelopeOpen);
      envelopeScene.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          handleEnvelopeOpen();
        }
      });

      /* --- SCREEN 2: Two-Step Interactive Cake --- */
      function handleCakeTap() {
        if (currentScreen !== 2) return;
        const rect = cakeStage.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height * 0.35;

        if (cakeStep === 0) {
          // Step 1: Blow out the candles with smoke & golden sparkles
          cakeStep = 1;
          cakeStage.classList.add('candles-out');
          SoundEngine.playChime('wish');

          ParticleFX.burstSparkles(cx - 28, cy, 14, true);
          ParticleFX.burstSparkles(cx, cy - 10, 18, true);
          ParticleFX.burstSparkles(cx + 28, cy, 14, true);

          cakeSubtitle.textContent = 'Your wish is on its way to the stars! 🌟';
          cakePrompt.textContent = 'Wish made! ✨ Tap the cake to cut it!';
        } else if (cakeStep === 1) {
          // Step 2: Cut the cake with sparkle sweep, slice pop, confetti & fireworks
          cakeStep = 2;
          cakeStage.classList.add('cake-cut');
          SoundEngine.playChime('celebrate');

          cakePrompt.textContent = 'Yay!! Party time! 🎉🎂';
          ParticleFX.burstConfetti(cx, cy + 45, 75);
          ParticleFX.burstFirework(window.innerWidth * 0.25, window.innerHeight * 0.25, 36);
          scheduleTimer(() => {
            ParticleFX.burstFirework(window.innerWidth * 0.75, window.innerHeight * 0.24, 38);
          }, 220);

          // Smoothly transition to Screen 3 after ~1.15s
          scheduleTimer(() => {
            goToScreen(3);
          }, 1150);
        }
      }

      cakeStage.addEventListener('click', handleCakeTap);
      cakeStage.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          handleCakeTap();
        }
      });

      /* --- SCREEN 3: Keyboard Arrow Navigation & Next Screen Button --- */
      window.addEventListener('keydown', (e) => {
        if (currentScreen !== 3) return;
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          PolaroidDeck.nextCard();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          PolaroidDeck.prevCard();
        }
      });

      document.getElementById('btn-to-letter').addEventListener('click', () => {
        SoundEngine.playChime('sparkle');
        goToScreen(4);
      });

      /* --- SCREEN 4: Staggered Letter Reveal & Grand Finale --- */
      function startLetterFinale() {
        // Reset before revealing
        letterParas.forEach((p) => p.classList.remove('visible'));
        finaleIcons.classList.remove('visible');

        // Staggered paragraph fade-and-rise every ~460ms
        letterParas.forEach((para, idx) => {
          scheduleTimer(() => {
            para.classList.add('visible');
          }, 380 + idx * 460);
        });

        // Reveal bouncing 🎉💖 icons after the final paragraph
        scheduleTimer(() => {
          finaleIcons.classList.add('visible');
          ParticleFX.burstHearts(window.innerWidth / 2, window.innerHeight * 0.6, 18);
        }, 380 + letterParas.length * 460 + 220);

        // Initial gentle celebratory burst
        scheduleTimer(() => {
          ParticleFX.burstFirework(window.innerWidth * 0.24, window.innerHeight * 0.22, 34);
        }, 400);
        scheduleTimer(() => {
          ParticleFX.burstFirework(window.innerWidth * 0.76, window.innerHeight * 0.2, 34);
        }, 900);

        // Gentle periodic background fireworks while enjoying Screen 4
        if (finaleFireworksInterval) clearInterval(finaleFireworksInterval);
        finaleFireworksInterval = setInterval(() => {
          if (currentScreen !== 4) return;
          const fx = window.innerWidth * (0.14 + Math.random() * 0.72);
          const fy = window.innerHeight * (0.12 + Math.random() * 0.28);
          ParticleFX.burstFirework(fx, fy, 30);
        }, 2800);
      }

      // "Send More Confetti 🎉" Button
      document.getElementById('btn-more-confetti').addEventListener('click', () => {
        SoundEngine.playChime('celebrate');
        ParticleFX.grandCelebration();
      });

      // "Replay Card ↺" Button — Resets all 4 screens cleanly (including photo stack)
      document.getElementById('btn-replay').addEventListener('click', () => {
        clearAllTimers();
        SoundEngine.playChime('sparkle');

        // Reset Screen 1 (Envelope closed & seal restored)
        envelopeOpened = false;
        envelopeScene.classList.remove('opened');
        envelopePrompt.textContent = 'Tap to open 💌';

        // Reset Screen 2 (Candles relit, smoke cleared, cake uncut)
        cakeStep = 0;
        cakeStage.classList.remove('candles-out', 'cake-cut');
        cakeSubtitle.textContent = 'Make a wish & tap the candles...';
        cakePrompt.textContent = 'Tap the cake to blow out the candles 🕯️';

        // Reset Screen 3 Multi-Photo Polaroid Deck back to photo #1
        PolaroidDeck.reset();

        // Reset Screen 4 paragraphs & finale icons
        letterParas.forEach((p) => p.classList.remove('visible'));
        finaleIcons.classList.remove('visible');

        // Return smoothly to Screen 1
        goToScreen(1);
      });
    })();
  </script>
